title: Madrid Web
author: Tales Mançano
version: 1.0.0
quarto-required: ">=1.5.0"
contributes:
  formats:
    revealjs:
      theme: [default, madrid.scss]
      width: 1280
      height: 720
      margin: 0.04
      center: false
      slide-number: c/t
      navigation-mode: linear
      hash-type: number
      transition: none
      preview-links: auto
    beamer:
      theme: Madrid
      aspectratio: 169
      slide-level: 2
      pdf-engine: xelatex
      filters: [madrid.lua]
